<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Form</title>

    <link rel="stylesheet" href="form.css">

</head>
<body>
    <h1>APU Go Karting Club</h1>
    <h2>Enquiry Form</h2>
    <p>Have any questions? Fill in the form below and we will get back to you as soon as possible.</p>
    <br>

<div class="form-container">

<form>
    <label>Full name:</label>
    <br>
    <input type="text">
    <br>
    <br>

    <label>Email Address:</label>
    <br>
    <input type="email">
    <br>
    <br>

    <label>Phone Number:</label>
    <br>    
    <input type="tel">
    <br>
    <br>

    

    <label>Subject:</label>
    <select name="enquiry_type" required>
        <option value="training">Training</option>
        <option value="membership">Membership</option>
        <option value="event">Event</option>
        <option value="competition">Competition</option>
        <option value="other">Other</option>
    </select>
    <br>
    <br>

    <label>Prefered Contact Method:</label>
    <select name="contact_method" required>
        <option value="email">Email</option>
        <option value="phone">Phone</option>
    </select>
    <br>
    <br>

    <label>Your Message:</label>
    <br>    
    <textarea name="message" rows="10" cols="50">
    </textarea>
    <br>
    <br>

    <input type="button" value="Submit" onclick="submitForm()">
    <input type="button" value="Reset" onclick="resetForm()">   
</form>

<script>   
    function submitForm() {
        alert("Thank you for your enquiry! We will get back to you soon.");
        window.location.href = "index.html";
    }

    function resetForm() {
        document.forms[0].reset();
    }
</script>
</body>
</html>
