<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar"></div>
    <section class="video-section">
        <div class="video-container">
            <h2>Club Highlights</h2>
            <i><p>Watch our exciting video showcasing the thrill of go-karting and the vibrant community of APU Go Karting Club!</p></i>
        </div>
    <iframe width="560" height="315" 
    src="https://www.youtube.com/embed/_IndG31L18M?si=HH6U21rbzCRL2NgA" 
    title="YouTube video player" frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    referrerpolicy="strict-origin-when-cross-origin" 
    allowfullscreen></iframe>
<section class="photo-gallery">
    <h2>Gallery</h2>
    <p><i>Explore the thrilling moments captured at our events and races!</i></p>
<div class="gallery-grid">

    <img src="images/start of go kart race.webp" alt="Go Kart Race">
    <img src="images/event.jpg" alt="Karting Event">
    <img src="images/member.webp" alt="Club Members">
    <img src="images/award.jpg" alt="Award Ceremony">
    <img src="images/track.webp" alt="Race Track">
    <img src="images/racing.jpg" alt="Racing Action">

</div>
<script>
fetch("navbar.html")
.then(response => response.text())
.then(data=>{
    document.getElementById("navbar").innerHTML=data;
});
</script>
    
</body>

</html>
